services:
  - type: web
    name: etdv-communaute-api
    runtime: node
    repo: https://github.com/AMOUZOU-Kodjo/etdv-communaut-
    branch: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: etdv-communaute-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_CHANNEL_ID
        sync: false

databases:
  - name: etdv-communaute-db
    databaseName: etdv_communaute
    plan: free
